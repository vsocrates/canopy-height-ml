[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "canopy_height_prediction"
version = "0.0.1"
description = "Use XGBoost to predict canopy height based on NASA GEDI and spectrography images"
authors = [
  { name = "Vimig Socrates" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "loguru",
    "pip",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
    # ML / modeling
    "xgboost",
    "lightgbm",
    "scikit-learn",
    "mlflow",
    # Geospatial
    "geopandas",
    "rasterio",
    "rasterstats",
    # Google Earth Engine
    "geemap",
    # GEDI / HDF5 data
    "h5py",
    # Notebooks & visualization
    "jupyter",
    "jupyterlab",
    "matplotlib",
    "seaborn",
    # Data wrangling
    "numpy",
    "pandas",
    # Agentic pipeline
    "pydantic-ai[anthropic]>=0.0.14",
    "logfire[pydantic-ai]",
    "sqlalchemy>=2.0",
    "alembic",
    # Testing
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["canopy_height_prediction"]
include = ["pyproject.toml", "canopy_height_prediction/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["canopy_height_prediction"]
force-sort-within-sections = true

